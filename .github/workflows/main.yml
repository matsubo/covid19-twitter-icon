name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

env:
  TEST_IMAGE: covid19-twitter-icon:test
  APP_IMAGE: covid19-twitter-icon:ci

jobs:
  test:
    name: Lint & test (Dockerfile.test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.test
          load: true
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test

      - name: Lint
        run: docker run --rm "$TEST_IMAGE" bundle exec rubocop

      - name: Test
        run: docker run --rm "$TEST_IMAGE" bundle exec rspec

  generate:
    name: Generate iconset (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.APP_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate icons
        run: docker run --rm -v "$PWD/output:/app/output" "$APP_IMAGE"

      - name: Upload iconset
        uses: actions/upload-artifact@v4
        with:
          name: iconset
          path: output/
